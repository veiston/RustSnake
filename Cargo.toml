[package]
name = "snake"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.0"
rand = "0.10.0"

[profile.dev]
opt-level = 1
debug = 1
incremental = true
lto = "off"
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false